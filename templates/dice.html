{% extends 'base.html' %}

{% block title %}Кости — Физтех апостолы{% endblock %}

{% block nav %}
<nav class="navbar">
    <a href="{{ url_for('games') }}" class="navbar-brand">← К играм</a>
    <div class="navbar-links">
        <a href="{{ url_for('profile') }}">Профиль</a>
        <a href="{{ url_for('top') }}">Топ</a>
        <a href="{{ url_for('logout') }}" class="nav-logout">Выйти</a>
    </div>
</nav>
{% endblock %}

{% block content %}
<div class="page" style="max-width:600px">

    <div class="page-header" style="text-align:center">
        <h1 class="page-title">🎲 Кости</h1>
        <p class="page-sub">Угадай число от 1 до 6 и удвой ставку</p>
    </div>

    <div class="card dice-wrap">

        <div class="dice-face" id="dice">🎲</div>

        <div class="dice-inputs">
            <div class="form-group">
                <label class="form-label">Ваша ставка</label>
                <input type="number" id="bet" class="form-input"
                       placeholder="Кол-во монет" min="1"
                       max="{{ current_user.coins }}">
            </div>
            <div class="form-group">
                <label class="form-label">Число (1–6)</label>
                <input type="number" id="target" class="form-input"
                       placeholder="1–6" min="1" max="6">
            </div>
        </div>

        <button onclick="rollDice()" class="btn btn-primary btn-full btn-lg">
            Бросить кубик
        </button>

        <div class="coins-line">
            Монеты: <strong><span id="coins">{{ current_user.coins }}</span></strong>
        </div>
        <div class="dice-result" id="result"></div>

    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const FACES = ['', '⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];

    async function rollDice() {
        const bet    = parseInt(document.getElementById('bet').value);
        const target = parseInt(document.getElementById('target').value);
        const dice   = document.getElementById('dice');
        const result = document.getElementById('result');
        const btn    = document.querySelector('button');

        result.textContent = '';
        result.className   = 'dice-result';

        if (isNaN(bet) || bet <= 0 || bet > {{ current_user.coins }}) {
            result.textContent = '⚠ Неверная ставка!';
            result.className   = 'dice-result lose';
            return;
        }
        if (isNaN(target) || target < 1 || target > 6) {
            result.textContent = '⚠ Число должно быть от 1 до 6!';
            result.className   = 'dice-result lose';
            return;
        }

        btn.disabled = true;
        dice.classList.add('rolling');

        const data = await fetch('/roll_dice', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            // Сервер сам бросает кубик — клиент передаёт только ставку и цель
            body: `bet=${bet}&target=${target}`,
        }).then(r => r.json());

        setTimeout(() => {
            dice.classList.remove('rolling');

            if (data.error) {
                result.textContent = '⚠ ' + data.error;
                result.className   = 'dice-result lose';
            } else {
                dice.textContent = FACES[data.dice_result];   // результат от сервера
                document.getElementById('coins').textContent = data.coins;

                if (data.result === 'win') {
                    result.textContent = '🎉 Вы выиграли!';
                    result.className   = 'dice-result win';
                } else {
                    result.textContent = '😞 Вы проиграли';
                    result.className   = 'dice-result lose';
                }
            }
            btn.disabled = false;
        }, 800);
    }
</script>
{% endblock %}
