{% extends 'base.html' %}

{% block title %}{{ code }} — {{ title }}{% endblock %}

{% block content %}
<div class="page error-page" style="text-align:center">
    <div class="error-code">{{ code }}</div>
    <h1 class="page-title">{{ title }}</h1>
    <p class="page-sub">{{ message }}</p>
    <div style="margin-top:24px; display:flex; gap:12px; justify-content:center; flex-wrap:wrap">
        <a href="{{ url_for('main_menu') if current_user.is_authenticated else url_for('home') }}"
           class="btn btn-primary">← На главную</a>
        {% if current_user.is_authenticated %}
        <a href="{{ url_for('games') }}" class="btn btn-secondary">К играм</a>
        {% endif %}
    </div>
</div>
{% endblock %}
