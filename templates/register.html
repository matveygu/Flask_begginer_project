{% extends 'base.html' %}

{% block title %}Регистрация — Физтех апостолы{% endblock %}

{% block nav %}{% endblock %}
{% block footer %}{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-logo">
            <img src="{{ url_for('static', filename='images/uploads/logo1.png') }}" alt="Logo"
                 onerror="this.style.display='none'">
        </div>
        <h1 class="auth-title">Регистрация</h1>
        <p class="auth-sub">Создайте аккаунт, чтобы начать играть</p>

        <form method="POST" action="{{ url_for('register') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label class="form-label">Имя пользователя</label>
                <input type="text" name="username" class="form-input"
                       placeholder="Придумайте имя" required autofocus>
            </div>
            <div class="form-group">
                <label class="form-label">Пароль <span style="color:var(--muted);font-size:12px">(минимум 6 символов)</span></label>
                <input type="password" name="password" class="form-input"
                       placeholder="Придумайте пароль" required minlength="6">
            </div>
            <div class="form-group">
                <label class="form-label">Подтвердите пароль</label>
                <input type="password" name="password2" class="form-input"
                       placeholder="Повторите пароль" required minlength="6">
            </div>

            <button type="submit" class="btn btn-primary btn-full">Зарегистрироваться</button>
        </form>

        <div class="auth-footer">
            <p>Уже есть аккаунт? <a href="{{ url_for('login') }}">Войти</a></p>
        </div>
    </div>
</div>
{% endblock %}
