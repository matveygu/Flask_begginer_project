{% extends 'base.html' %}

{% block title %}Редактировать профиль{% endblock %}

{% block content %}
<div class="page" style="max-width:600px">

    <div class="page-header">
        <h1 class="page-title">Редактировать профиль</h1>
        <p class="page-sub">Измените свои данные и сохраните изменения</p>
    </div>

    <div class="card">
        <div style="text-align:center; margin-bottom:24px">
            <img src="{{ url_for('static', filename='images/uploads/' + user.photo) }}"
                 alt="Текущее фото" class="profile-avatar"
                 onerror="this.style.display='none'">
        </div>

        <form method="POST" enctype="multipart/form-data">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label class="form-label">Новое фото профиля</label>
                <input type="file" name="photo" class="form-input" accept="image/*">
            </div>
            <div class="form-group">
                <label class="form-label">Имя пользователя</label>
                <input type="text" name="username" class="form-input"
                       value="{{ user.username }}" required>
            </div>
            <div class="form-group">
                <label class="form-label">О себе</label>
                <textarea name="description" class="form-input"
                          placeholder="Расскажите о себе...">{{ user.description }}</textarea>
            </div>
            <button type="submit" class="btn btn-primary btn-full">
                Сохранить изменения
            </button>
        </form>
    </div>

</div>
{% endblock %}
