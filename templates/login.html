{% extends 'base.html' %}

{% block title %}Вход — Физтех апостолы{% endblock %}

{% block nav %}{% endblock %}
{% block footer %}{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-logo">
            <img src="{{ url_for('static', filename='images/uploads/logo1.png') }}" alt="Logo"
                 onerror="this.style.display='none'">
        </div>
        <h1 class="auth-title">Войти</h1>
        <p class="auth-sub">Введите ваши данные для входа</p>

        <form method="POST" action="{{ url_for('login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label class="form-label">Имя пользователя</label>
                <input type="text" name="username" class="form-input"
                       placeholder="Введите имя" required autofocus>
            </div>
            <div class="form-group">
                <label class="form-label">Пароль</label>
                <input type="password" name="password" class="form-input"
                       placeholder="Введите пароль" required>
            </div>

            <label style="display:flex; align-items:center; gap:8px; font-size:13px;
                          color:var(--text-2); margin-bottom:16px; cursor:pointer">
                <input type="checkbox" name="remember" style="width:16px; height:16px; accent-color:var(--blue)">
                Запомнить меня
            </label>

            <button type="submit" class="btn btn-primary btn-full">Войти</button>
        </form>

        <div class="auth-footer">
            <p>Нет аккаунта? <a href="{{ url_for('register') }}">Зарегистрироваться</a></p>
        </div>
    </div>
</div>
{% endblock %}
